# Run with
# GIT_USER="<your name>" GIT_EMAIL="<your email>" docker compose -f docker-compose.mmlac.yaml up -d
#
# Exec into the container with: docker compose -f docker-compose.mmlac.yaml exec gascity zsh

services:
  gascity:
    build:
      context: .
      dockerfile: Dockerfile.mmlac
    container_name: gascity
    stdin_open: false
    tty: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - NET_RAW
    environment:
      IS_SANDBOX: 1
      GIT_USER: "${GIT_USER:?GIT_USER is required. Run with: GIT_USER=\"Your Name\" GIT_EMAIL=\"you@example.com\" docker compose ...}"
      GIT_EMAIL: "${GIT_EMAIL:?GIT_EMAIL is required. Run with: GIT_USER=\"Your Name\" GIT_EMAIL=\"you@example.com\" docker compose ...}"
    volumes:
      - gc-home:/home/agent
      - gc-data:/gc
      - /Users/mmlac/Library/Application Support/Tessera:/Users/mmlac/Library/Application Support/Tessera
    ports:
      - "6969:6969"
      - "8372:8372"
      - "8080:8080"
      - "3000:3000"
      - "3001:3001"
    command: sleep infinity

volumes:
  gc-home:
  gc-data:
